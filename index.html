<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090b17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sun Breathing" />
    <meta name="description" content="Sun Breathing: The Final Gift - một trận chiến pixel art đặc biệt." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Sun Breathing: The Final Gift</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Sun Breathing: The Final Gift">
      <div class="screen-frame">
        <canvas id="gameCanvas" width="1920" height="1080" aria-label="Game canvas"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
      </div>
      <div class="mobile-controls" aria-label="Điều khiển cảm ứng">
        <div class="joystick-panel">
          <div class="joystick" id="joystick" aria-label="Joystick di chuyển dọc">
            <div class="joystick-ring"></div>
            <div class="joystick-thumb" id="joystickThumb"></div>
          </div>
          <span class="control-caption">DI CHUYỂN</span>
        </div>
        <button class="mobile-attack" id="mobileAttack" type="button" aria-label="Tung chiêu Hơi Thở Mặt Trời">
          <span class="attack-sigil" aria-hidden="true"></span>
          <span>CHIÊU</span>
        </button>
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Bật toàn màn hình">FULL</button>
      </div>
      <div class="fullscreen-help" id="fullscreenHelp" hidden>
        <div class="fullscreen-help-card" role="dialog" aria-modal="true" aria-labelledby="fullscreenHelpTitle">
          <button class="fullscreen-help-close" id="fullscreenHelpClose" type="button" aria-label="Đóng hướng dẫn">×</button>
          <div class="help-kicker">IPHONE SAFARI</div>
          <h2 id="fullscreenHelpTitle">Muốn ẩn thanh Safari?</h2>
          <p>iPhone không cho game HTML chiếm màn hình như video khi đang ở trong Safari.</p>
          <p class="help-steps"><b>Chia sẻ</b> → <b>Thêm vào Màn hình chính</b> → mở game từ biểu tượng mới. Khi đó game sẽ chạy như một app toàn màn hình.</p>
          <button class="help-ok" id="fullscreenHelpOk" type="button">ĐÃ HIỂU</button>
        </div>
      </div>
      <p class="sr-only" id="game-status" aria-live="polite"></p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
